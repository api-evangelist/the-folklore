aid: the-folklore
name: The Folklore
description: >-
  The Folklore is a commerce platform and B2B wholesale marketplace that helps
  emerging and diverse consumer brands sell and market globally, connecting them
  with retail buyers and shoppers through dropship, shipping, and commerce
  technology. Its storefront runs on Shopify and exposes a modern agent-commerce
  surface: a Universal Commerce Protocol (UCP) MCP endpoint for agent-driven
  search, cart, checkout, and fulfillment, Shopify Customer Account OpenID
  Connect authentication, and published /llms.txt and /agents.md instructions so
  AI shopping agents can transact with buyer approval.
